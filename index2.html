<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Portfolio Luiz Eduardo</title>
  <style>
    body { 
      width: 320px;
      margin: 0; 
      padding: 12px; 
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
    }
    
    header {
      text-align: center;
      margin-bottom: 15px;
      border-bottom: 2px solid #0060df;
      padding-bottom: 10px;
    }
    header h1 {
      font-size: 18px;
      margin: 0 0 5px 0;
      color: #333;
    }
    header h1 span {
      display: block;
      font-size: 12px;
      color: #666;
      font-weight: normal;
    }
    .btn-curriculo {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      margin-top: 5px;
    }
    .btn-curriculo:hover {
      background-color: #218838;
    }

    .menu-superior { 
      display: flex; 
      justify-content: space-between; 
      gap: 5px; 
      margin-bottom: 15px;
    }
    .menu-superior button { 
      flex: 1;
      padding: 8px; 
      cursor: pointer; 
      background-color: #0060df; 
      color: white; 
      border: none; 
      border-radius: 4px; 
      font-weight: bold;
      font-size: 12px;
    }
    .menu-superior button:hover { 
      background-color: #003e9e; 
    }
 
    .conteudo {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      min-height: 60px;
      background-color: white;
      font-size: 13px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <header>
    <h1>Luiz Eduardo <span>Desenvolvedor Fullstack</span></h1>
    <button class="btn-curriculo" id="btn-curriculo">Visualizar Currículo</button>
  </header>

  <div class="menu-superior">
    <button id="btn-inicio">Início</button>
    <button id="btn-sobre">Sobre</button>
    <button id="btn-contato">Contato</button>
  </div>
  
  <div class="conteudo" id="aba-conteudo">
    Bem-vindo ao meu portfólio!
  </div>

  <script src="popup.js"></script>
</body>
background-color:#0060df

</html>
